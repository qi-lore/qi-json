# GoReleaser configuration for the qi-json-gen code generator.
#
# The qi-json library is consumed as a Go module; only the optional
# `cmd/qi-json-gen` command is shipped as a prebuilt binary, so callers can
# install it without the repository. This file builds archives for linux, macOS
# and Windows (amd64 and arm64), attaches them and a checksums file to the
# GitHub release, and pushes a Homebrew cask to the qi-lore/homebrew-tap tap
# (a separate repository that must exist; see the README).
#
# It is run by .github/workflows/release.yml when a vX.Y.Z tag is pushed.
# Validate local changes with `goreleaser check` (see `make release-check`).

version: 2

project_name: qi-json-gen

builds:
  - id: qi-json-gen
    main: ./cmd/qi-json-gen
    binary: qi-json-gen
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: qi-json-gen
    ids:
      - qi-json-gen
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

homebrew_casks:
  - name: qi-json-gen
    binaries:
      - qi-json-gen
    homepage: "https://github.com/qi-lore/qi-json"
    description: "Code generator for the qi-json reflection-free JSON library"
    directory: Casks
    commit_msg_template: "chore: update qi-json-gen cask to {{ .Tag }}"
    commit_author:
      name: qi-json-releaser
      email: qi-json-releaser@users.noreply.github.com
    repository:
      owner: qi-lore
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
