# CI for qi-json.
#
# Enforces the two rules in docs/constitution.md ("Git and Review Discipline"
# and the Verification Workflow) that can be checked mechanically:
#
#   * the verification sequence: go test -> gofmt -> go vet -> golangci-lint
#     (the same order as `make verify`);
#   * Conventional Branch names on pull-request source branches;
#   * only `dev` may open a pull request into `main`;
#   * Conventional Commits subjects and a non-empty body on every commit.
#
# Branch protection (only `dev` -> `main`, required status checks) still has to
# be configured in the repository settings; a workflow cannot enforce it alone.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: go test
        run: go test ./... -count=1
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        # v9 of the action runs golangci-lint v2 (v6 pulled v1, which is built
        # with an older Go and rejects a go 1.27 module). Pin the same version
        # the local tool reports so the gate is reproducible.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  branch-name:
    name: branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # The protected branches themselves are exempt.
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "dev" ]; then
            exit 0
          fi
          # type (or an AI-agent prefix) / kebab-case description; aliases
          # feat/ and fix/ are allowed; no consecutive or trailing separators.
          pattern='^(feature|feat|bugfix|fix|hotfix|release|chore|ai|copilot|cursor|claude|codex)/[a-z0-9]+([.-][a-z0-9]+)*$'
          if ! printf '%s' "$BRANCH" | grep -Eq "$pattern"; then
            echo "::error::branch '$BRANCH' does not follow Conventional Branch ($pattern)"
            exit 1
          fi

  target-branch:
    name: target branch
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: only dev may target main
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$BRANCH" != "dev" ]; then
            echo "::error::only the dev branch may open a pull request into main (got '$BRANCH')"
            exit 1
          fi

  commits:
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # type(scope)!: subject — the Conventional Commits grammar.
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          fail=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            subject="$(git log -1 --format='%s' "$sha")"
            body="$(git log -1 --format='%b' "$sha")"
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "::error::$sha is not a Conventional Commit: $subject"
              fail=1
            fi
            if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
              echo "::error::$sha has an empty body; a full body is required: $subject"
              fail=1
            fi
          done
          exit $fail
